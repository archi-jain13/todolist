<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickDo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="frame">
        <div class="shadow-layer" aria-hidden="true"></div>
        <main class="card">
            <div class="corner-fold" aria-hidden="true"></div>
            <header class="header">
                <div>
                    <p class="eyebrow">PERSONAL FOCUS BOARD</p>
                    <h1>QuickDo</h1>
                </div>
                <div class="badge" aria-hidden="true">QD</div>
            </header>
            <form id="task-form">
                <label class="field-label" for="task-input">What needs doing?</label>
                <div class="input-row">
                    <div class="input-wrap">
                        <input id="task-input" type="text" placeholder="Plan tomorrow's priorities" autocomplete="off">
                    </div>
                    <button id="add-btn" type="submit"><span aria-hidden="true">+</span> Add task</button>
                </div>
            </form>
            <section aria-labelledby="list-heading">
                <div class="list-header">
                    <h2 id="list-heading">Today</h2>
                    <div class="list-controls">
                        <div class="filters" aria-label="Filter tasks">
                            <button class="filter-btn active" type="button" data-filter="All">All</button>
                            <button class="filter-btn" type="button" data-filter="Active">Active</button>
                            <button class="filter-btn" type="button" data-filter="Done">Done</button>
                        </div>
                        <span id="count-pill" aria-live="polite">0 tasks</span>
                    </div>
                </div>
                <div id="task-list" aria-live="polite"></div>
                <div class="list-footer" id="list-footer" hidden>
                    <span id="done-summary">0 of 0 done</span>
                    <button id="clear-completed" type="button" hidden>Clear completed</button>
                </div>
            </section>
            <footer class="footer-strip">
                <span class="tagline">One thing at a time.</span>
                <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
            </footer>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
